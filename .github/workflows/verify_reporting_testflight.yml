name: Verify approved reporting TestFlight processing
# Inspect the uploaded build without assuming its marketing version.
on:
  workflow_dispatch:
  push:
    branches: [codex/validate-basal-reporting]
    paths: ['.github/workflows/verify_reporting_testflight.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: bundle install
      - name: Read Apple processing status without changing distribution
        run: bundle exec ruby reporting-validation/verify_testflight.rb
        env:
          TEAMID: ${{ secrets.TEAMID }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
