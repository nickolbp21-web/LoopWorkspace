name: CodeQL security analysis
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 2'
permissions:
  contents: read
concurrency:
  group: codeql-security-${{ github.ref }}
  cancel-in-progress: false
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            os: ubuntu-latest
            build-mode: none
          - language: ruby
            os: ubuntu-latest
            build-mode: none
          - language: swift
            os: macos-26
            build-mode: manual
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.language == 'swift' && 120 || 30 }}
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: ${{ matrix.language == 'swift' && 'recursive' || 'false' }}
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Compile Swift for analysis (non-distributable)
        if: matrix.language == 'swift'
        run: >-
          xcodebuild -workspace LoopWorkspace.xcworkspace -scheme LoopWorkspace
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES VALIDATE_PRODUCT=NO
          -derivedDataPath /tmp/codeql-loop-derived build
      - name: Analyze
        uses: github/codeql-action/analyze@5895b2c9be147bc7f1c75ce72c5cb577febb1907
        with:
          category: /language:${{ matrix.language }}
