name: Upload approved reporting candidate to TestFlight
on:
  workflow_dispatch:
  push:
    branches: [codex/validate-basal-reporting]
    paths: ['.github/workflows/upload_reporting_candidate.yml']
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MATCH_READONLY: 'true'
      GYM_CLONED_SOURCE_PACKAGES_PATH: /tmp/reporting-packages
      GYM_DISABLE_PACKAGE_AUTOMATIC_UPDATES: 'true'
      GYM_SKIP_PACKAGE_REPOSITORY_FETCHES: 'true'
      PILOT_CHANGELOG: 'Reporting only: preserve precise basal timestamps and recover cached immutable basal records as notes. No dosing changes.'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Select existing compiler
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
      - name: Apply the tested reporting patch
        run: |
          python3 - <<'PY'
          import hashlib,subprocess
          from pathlib import Path
          p=Path('reporting-validation/reporting-only.patch')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'cc20322892a72a40b0eeea1b4e5b7f0af5da23173e4b28b10bff4ff512706409'
          subprocess.run(['git','-C','NightscoutService','apply','--check','../reporting-validation/reporting-only.patch'],check=True)
          subprocess.run(['git','-C','NightscoutService','apply','../reporting-validation/reporting-only.patch'],check=True)
          for repo, name in [('LoopKit','snapshot-loopkit.patch'),('Loop','snapshot-loop.patch')]:
            subprocess.run(['git','-C',repo,'apply','--check','../reporting-validation/'+name],check=True)
            subprocess.run(['git','-C',repo,'apply','../reporting-validation/'+name],check=True)
          PY
      - name: Resolve pinned reporting packages
        run: xcodebuild -resolvePackageDependencies -workspace LoopWorkspace.xcworkspace -scheme LoopWorkspace -clonedSourcePackagesDirPath /tmp/reporting-packages
      - name: Add validated precision metadata to pinned serializer
        run: python3 reporting-validation/prepare_package_precision.py /tmp/reporting-packages
      - name: Install existing pinned build dependencies
        run: bundle install
      - name: Suppress credential-derived table output
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'PY'
          import os,base64
          value=os.environ['GITHUB_REPOSITORY_OWNER']+':'+os.environ['GH_PAT']
          print('::add-mask::'+base64.b64encode(value.encode()).decode())
          PY
          TABLE_PRINTER_PATH=$(bundle exec ruby -e 'puts Gem::Specification.find_by_name("fastlane").gem_dir')/match/lib/match/table_printer.rb
          test -f "$TABLE_PRINTER_PATH"
          sed -i "" "/puts(Terminal::Table.new(params))/d" "$TABLE_PRINTER_PATH"
      - name: Build signed candidate using existing certificates only
        run: bundle exec fastlane build_loop
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      - name: Require exact reporting validation before distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 36971556370 --repo "$GITHUB_REPOSITORY" --json conclusion,headSha > /tmp/reporting-test-result.json
          python3 - <<'PY'
          import json
          result=json.load(open('/tmp/reporting-test-result.json'))
          assert result['headSha']=='480efa23c7f69d2f750ee3c6d4c3ce4193c09c91'
          assert result['conclusion']=='success', 'Reporting validation must pass before distribution'
          PY
      - name: Upload approved candidate to existing TestFlight app
        run: bundle exec fastlane release
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
