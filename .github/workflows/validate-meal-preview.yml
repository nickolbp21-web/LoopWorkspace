name: Validate meal preview handoff
on:
  pull_request:
    paths:
      - 'patches/meal-preview.patch'
      - 'meal-preview/**'
      - '.github/workflows/validate-meal-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Select existing compiler
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
      - name: Preserve existing reporting customizations
        run: |
          git -C NightscoutService apply ../reporting-validation/reporting-only.patch
          git -C LoopKit apply ../reporting-validation/snapshot-loopkit.patch
          git -C Loop apply ../reporting-validation/snapshot-loop.patch
      - name: Apply only the meal preview patch
        run: |
          git apply --check patches/meal-preview.patch
          git apply patches/meal-preview.patch
      - name: Test actual patched parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('Loop/Loop/Managers/DeeplinkManager.swift').read_text()
          parser = source.split('// BEGIN MEAL PREVIEW PARSER')[1].split('// END MEAL PREVIEW PARSER')[0]
          Path('/tmp/test-meal-preview.swift').write_text('import Foundation\n' + parser + '\n' + Path('meal-preview/test-preview.swift').read_text())
          PY
          swift /tmp/test-meal-preview.swift
      - name: Test native handoff with local simulator signing
        run: |
          set -o pipefail
          bundle install
          bundle exec ruby meal-preview/prepare-native-tests.rb
          cat meal-preview/MealPreviewHandoffTests.swift >> Loop/LoopTests/LoopTests.swift
          xcrun simctl list devices available --json > /tmp/meal-devices.json
          MEAL_SIMULATOR=$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/meal-devices.json'))
          rows=[d for runtime,devices in data['devices'].items() if 'iOS' in runtime for d in devices if d.get('isAvailable') and 'iPhone' in d['name']]
          assert rows, 'No available iPhone simulator'
          print(rows[0]['udid'])
          PY
          )
          xcodebuild -resolvePackageDependencies -workspace LoopWorkspace.xcworkspace -scheme MealPreviewValidation -clonedSourcePackagesDirPath /tmp/reporting-packages
          python3 reporting-validation/prepare_package_precision.py /tmp/reporting-packages
          xcodebuild test -workspace LoopWorkspace.xcworkspace -scheme MealPreviewValidation -configuration Debug -destination "id=$MEAL_SIMULATOR" -only-testing:LoopTests/MealPreviewHandoffTests -parallel-testing-enabled NO -clonedSourcePackagesDirPath /tmp/reporting-packages -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual > "$RUNNER_TEMP/meal-preview-build.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/meal-preview-build.log"; exit 1; }
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: meal-preview-build-log
          path: ${{ runner.temp }}/meal-preview-build.log
